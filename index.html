<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gem Quest - a fast-paced arena survival roguelite. Defeat waves of enemies, collect loot, and conquer 4 themed stages." />
  <meta name="theme-color" content="#0a0a1a" />
  <title>Gem Quest - Arena Survival</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>" />
</head>
<body>
  <!-- Boot / loading screen shown until the game is ready -->
  <div id="boot-screen" role="status" aria-live="polite">
    <div class="boot-title">GEM QUEST</div>
    <div class="boot-sub">ARENA SURVIVAL</div>
    <div class="boot-spinner"></div>
    <div class="boot-text" id="boot-text">Loading...</div>
    <button class="boot-start" id="boot-start" type="button">CLICK TO START</button>
  </div>

  <div id="fatal-screen" class="hidden" role="alert" aria-live="assertive">
    <div class="fatal-card">
      <div class="fatal-kicker">RIFT INTERRUPTED</div>
      <h1>Gem Quest needs to restart</h1>
      <p id="fatal-message">An unexpected error stopped the game safely.</p>
      <button id="fatal-retry" type="button">RELOAD GAME</button>
    </div>
  </div>

  <!-- The game container. Sized to a 16:9 letterbox inside the viewport. -->
  <div id="game-container">
    <canvas id="game-canvas" tabindex="0" role="application" aria-label="Gem Quest game canvas. Use WASD or ZQSD to move, Space to dash, E for Nova, number keys to choose rewards, and arrow keys plus Enter to navigate menus."></canvas>
    <div id="touch-controls" class="hidden" aria-hidden="true">
      <div id="touch-joystick"><div id="touch-stick"></div></div>
    </div>
  </div>

  <!-- The portal SDK loads asynchronously with a bounded fallback. Deferred
       local scripts preserve their dependency order without blocking HTML. -->
  <script defer src="js/sdk-loader.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/sdk.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/input.js"></script>
  <script defer src="js/particles.js"></script>
  <script defer src="js/sprites.js"></script>
  <script defer src="js/item-art.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/mechanics.js"></script>
  <script defer src="js/player.js"></script>
  <script defer src="js/enemies.js"></script>
  <script defer src="js/items.js"></script>
  <script defer src="js/lootbox.js"></script>
  <script defer src="js/stages.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/game.js"></script>
  <script defer src="js/release-fixes.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
