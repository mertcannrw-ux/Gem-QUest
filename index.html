<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Gem Quest - a fast-paced arena survival roguelite. Defeat waves of enemies, collect loot, and conquer 4 themed stages." />
  <meta name="theme-color" content="#0a0a1a" />
  <title>Gem Quest - Arena Survival</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>" />
</head>
<body>
  <!-- Boot / loading screen shown until the game is ready -->
  <div id="boot-screen" role="status" aria-live="polite">
    <div class="boot-title">GEM QUEST</div>
    <div class="boot-sub">ARENA SURVIVAL</div>
    <div class="boot-spinner"></div>
    <div class="boot-text" id="boot-text">Loading...</div>
    <button class="boot-start" id="boot-start" type="button">CLICK TO START</button>
  </div>

  <div id="fatal-screen" class="hidden" role="alert" aria-live="assertive">
    <div class="fatal-card">
      <div class="fatal-kicker">RIFT INTERRUPTED</div>
      <h1>Gem Quest needs to restart</h1>
      <p id="fatal-message">An unexpected error stopped the game safely.</p>
      <button id="fatal-retry" type="button">RELOAD GAME</button>
    </div>
  </div>

  <!-- The game container. Sized to a 16:9 letterbox inside the viewport. -->
  <div id="game-container">
    <canvas id="game-canvas" tabindex="0"></canvas>
    <div id="touch-controls" class="hidden">
      <div id="touch-joystick"><div id="touch-stick"></div></div>
    </div>
  </div>

  <!-- The portal SDK loads asynchronously with a bounded fallback. Deferred
       local scripts preserve their dependency order without blocking HTML. -->
  <script defer src="js/sdk-loader.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/core/random.js"></script>
  <script defer src="js/core/constants.js"></script>
  <script defer src="js/core/game-state.js"></script>
  <script defer src="js/core/lifecycle.js"></script>
  <script defer src="js/sdk.js"></script>
  <script defer src="js/audio/audio-context.js"></script>
  <script defer src="js/audio/mixer.js"></script>
  <script defer src="js/audio/music.js"></script>
  <script defer src="js/audio/ambience.js"></script>
  <script defer src="js/audio/sfx.js"></script>
  <script defer src="js/audio/audio.js"></script>
  <script defer src="js/input.js"></script>
  <script defer src="js/particles.js"></script>
  <script defer src="js/render/sprite.js"></script>
  <script defer src="js/render/catalogs/player-sprites.js"></script>
  <script defer src="js/render/catalogs/enemy-sprites.js"></script>
  <script defer src="js/render/catalogs/item-sprites.js"></script>
  <script defer src="js/render/catalogs/projectile-sprites.js"></script>
  <script defer src="js/render/catalogs/tile-sprites.js"></script>
  <script defer src="js/render/catalogs/prop-sprites.js"></script>
  <script defer src="js/item-art.js"></script>
  <script defer src="js/content/items.js"></script>
  <script defer src="js/content/enemies.js"></script>
  <script defer src="js/content/stages.js"></script>
  <script defer src="js/content/shop.js"></script>
  <script defer src="js/content/lootboxes.js"></script>
  <script defer src="js/platform/settings-store.js"></script>
  <script defer src="js/platform/save-schema.js"></script>
  <script defer src="js/platform/meta-progress.js"></script>
  <script defer src="js/game/canvas-viewport.js"></script>
  <script defer src="js/game/game-loop.js"></script>
  <script defer src="js/game/world-session.js"></script>
  <script defer src="js/world/environment-system.js"></script>
  <script defer src="js/world/environment-renderer.js"></script>
  <script defer src="js/world/terrain-renderer.js"></script>
  <script defer src="js/world/world-renderer.js"></script>
  <script defer src="js/world/menu-background-renderer.js"></script>
  <script defer src="js/combat/combat-coordinator.js"></script>
  <script defer src="js/mechanics.js"></script>
  <script defer src="js/run/run-director.js"></script>
  <script defer src="js/run/combo-system.js"></script>
  <script defer src="js/run/bounty-system.js"></script>
  <script defer src="js/run/synergies.js"></script>
  <script defer src="js/run/event-common.js"></script>
  <script defer src="js/run/events/gem-storm.js"></script>
  <script defer src="js/run/events/starfall.js"></script>
  <script defer src="js/run/events/luminous-tide.js"></script>
  <script defer src="js/run/events/rift-frenzy.js"></script>
  <script defer src="js/player.js"></script>
  <script defer src="js/combat/mutations.js"></script>
  <script defer src="js/combat/projectile.js"></script>
  <script defer src="js/combat/enemy.js"></script>
  <script defer src="js/combat/enemy-ai.js"></script>
  <script defer src="js/combat/boss-ai.js"></script>
  <script defer src="js/combat/player-combat.js"></script>
  <script defer src="js/combat/drone-system.js"></script>
  <script defer src="js/items.js"></script>
  <script defer src="js/lootbox.js"></script>
  <script defer src="js/stages.js"></script>
  <script defer src="js/ui/ui-core.js"></script>
  <script defer src="js/ui/screens/main-menu.js"></script>
  <script defer src="js/ui/screens/help.js"></script>
  <script defer src="js/ui/screens/settings.js"></script>
  <script defer src="js/ui/screens/hud.js"></script>
  <script defer src="js/ui/screens/level-up.js"></script>
  <script defer src="js/ui/screens/stage-complete.js"></script>
  <script defer src="js/ui/screens/shop.js"></script>
  <script defer src="js/ui/screens/game-over.js"></script>
  <script defer src="js/ui/screens/pause.js"></script>
  <script defer src="js/ui/screens/victory.js"></script>
  <script defer src="js/ui/screens/director-overlay.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/game.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
